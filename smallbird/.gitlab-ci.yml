# 병합 게이트: 사람이든 AI 든 같은 검사를 통과해야 병합된다.
# GitLab 프로젝트 설정 > Merge requests 에서 "Pipelines must succeed" 를 켜고,
# 기본 브랜치를 protected 로 두어 직접 push 를 막는다. (CI 파일만으로는 강제되지 않는다)

stages: [verify, review, package, deploy]

variables:
  # stage·prod 가 같은 태그를 덮어쓰지 않게 환경 이름을 붙인다. 커밋별 태그가 Registry 에 남아 Environments 의 Rollback 으로 되돌릴 수 있다.
  STAGE_IMAGE: $CI_REGISTRY_IMAGE:stage-$CI_COMMIT_SHORT_SHA

default:
  # 같은 커밋은 언제 돌려도 같은 Node 로 검사하도록 패치 버전까지 고정한다. 올릴 때는 package.json engines(>=24 <25) 범위 안에서 바꾼다.
  image: node:24.22.0-bookworm
  interruptible: true
  # 캐시는 받기만 한다. 검사만 하는 job 은 패키지를 바꾸지 않아 다시 올려도 똑같다(job 당 약 20초 낭비).
  cache: &pnpm-cache
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
    policy: pull
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # MR 은 각자 소스 브랜치만 검사하므로(CE 는 merged-results 미지원), 여러 MR 이 합쳐진 stage 는 병합 후 다시 검사한다.
    # 실패 알림은 병합한 사람에게 간다. stage 가 실패하면 다음 병합보다 복구를 먼저 한다.
    # 배포도 이 파이프라인에서 하므로, stage → prod MR 이 열려 있어도 아래 규칙보다 먼저 만든다.
    - if: $CI_COMMIT_BRANCH == "stage"
    # 이 브랜치를 소스로 하는 열린 MR 이 있으면 브랜치 파이프라인은 만들지 않는다.
    # 같은 커밋을 MR 파이프라인이 검사하므로, 두 번 돌리지 않는다.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.verify:
  stage: verify
  # 멈춘 테스트가 기본값(60분)까지 러너를 붙잡지 않게 한다. 평소 job 은 4분 안에 끝난다.
  timeout: 10m
  # 러너·GitLab 인프라 오류만 한 번 재시도한다. 검사 실패와 시간 초과는 재시도하지 않는다(불안정한 테스트를 가리지 않게).
  retry:
    max: 1
    when: [runner_system_failure, api_failure, scheduler_failure]

# 가벼운 정적 검사는 한 job 에서 모두 실행한다. job 마다 러너 준비·캐시·설치에 1~2분이 드는데 검사는 5~30초라,
# 따로 두면 준비 시간만 늘고 러너 동시 실행 한도에 걸려 다른 job 이 기다린다.
# 하나가 실패해도 나머지를 끝까지 실행하고, 실패한 검사를 마지막에 모아 보여 준다.
static:
  extends: .verify
  # pnpm-lock.yaml 이 바뀐 파이프라인에서만 새 키의 캐시를 올린다. 매번 올리면 job 당 약 35초가 든다.
  cache:
    <<: *pnpm-cache
    policy: $PNPM_CACHE_POLICY
  variables:
    PNPM_CACHE_POLICY: pull
  rules:
    - changes: [pnpm-lock.yaml]
      variables:
        PNPM_CACHE_POLICY: pull-push
    - when: on_success
  script:
    # i18n:check 는 번역 파일의 언어별 키 구성·빈 값·위치와 생성 타입(resources.gen.d.ts)이 최신인지 검사한다.
    # ds:tokens:check 는 ds-tokens.css 가 Figma 스냅샷과 맞는지, test:scripts 는 디자인 대조 스크립트 테스트(node:test, Figma 토큰 불필요)다.
    - |
      failed=""
      for check in typecheck lint format:check i18n:check ds:tokens:check test:scripts; do
        echo "\$ pnpm $check"
        pnpm "$check" || failed="$failed $check"
      done
      if [ -n "$failed" ]; then
        echo "실패한 검사:$failed"
        exit 1
      fi

# 결과를 MR 위젯의 테스트 리포트로 보여 준다(실패·느린 테스트 확인용).
test:
  extends: .verify
  script:
    - pnpm test --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: reports/junit.xml

# 타입 검사는 static job 이 하므로 번들만 만든다(pnpm build 는 tsc 를 한 번 더 돌린다).
# stage 는 build:dist 가 같은 번들을 환경 값과 함께 만든다.
build:
  extends: .verify
  script: [pnpm exec vite build]
  rules:
    - if: $CI_COMMIT_BRANCH == "stage"
      when: never
    - when: on_success

# E2E 스모크(시범 운영): 빌드한 번들을 실제 브라우저(Chromium)로 열어 여러 화면을 잇는 흐름을 확인한다.
# stage 병합 후에는 자동으로, MR 에서는 필요할 때 수동으로 실행한다. 안정성과 소요 시간을 지켜본 뒤 필수 검사로 올릴지 정하므로,
# 그 전까지는 실패해도 병합·배포를 막지 않는다.
# Playwright 공식 이미지는 Node 26 이라 engines(>=24 <25)와 맞지 않아, 기본 이미지에 브라우저만 설치한다.
e2e:
  extends: .verify
  script:
    - pnpm exec playwright install --with-deps chromium
    - pnpm test:e2e
  artifacts:
    when: always
    expire_in: 1 week
    paths: [e2e/.output/report]
    reports:
      junit: e2e/.output/junit.xml
  rules:
    - if: $CI_COMMIT_BRANCH == "stage"
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

# [stage 배포 1/3] stage 환경 값으로 번들을 만들어 이미지 job 에 넘긴다.
# 필요한 CI 변수: STAGE_ENV_FILE(File 타입). .env.example 의 키를 stage 값으로 채운다.
# VITE_* 는 번들에 그대로 들어가 공개되므로 비밀 값은 넣지 않는다. VITE_API_*_URL 은 백엔드 절대 주소이고, VITE_PROXY_* 는 개발 서버 전용이라 넣지 않는다.
build:dist:
  extends: .verify
  script:
    - cp "$STAGE_ENV_FILE" .env.production.local
    - pnpm exec vite build
  artifacts:
    paths: [dist]
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "stage"

# [stage 배포 2/3] dist 를 nginx 이미지로 묶어 GitLab Container Registry 에 올린다.
# needs 를 쓰지 않아 verify 단계의 모든 검사가 통과해야 시작한다. 러너가 호스트 Docker 소켓을 쓰는 구성(biglink 와 같은 러너)을 전제로 한다.
build:image:
  stage: package
  image: docker:29.9.3-cli
  cache: []
  # 평소 30초 안에 끝난다. Registry 가 멈췄을 때 기본값(60분)까지 러너를 붙잡지 않게 한다.
  timeout: 10m
  dependencies: [build:dist]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f deploy/Dockerfile -t "$STAGE_IMAGE" .
    - docker push "$STAGE_IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == "stage"

# [stage 배포 3/3] stage 서버(EC2)에 SSH 로 접속해 compose 로 컨테이너를 교체한다.
# 필요한 CI 변수: STAGE_SSH_PRIVATE_KEY(File 타입, pem 내용), STAGE_SERVER_HOST(탄력적 IP),
#   STAGE_SSH_KNOWN_HOSTS(서버 호스트 공개 키 known_hosts 한 줄. 서버 안 /etc/ssh/ssh_host_*_key.pub 지문과 대조해 등록).
# 서버 준비: Docker·compose plugin 설치, 접속 계정이 docker 그룹에 속해 있어야 한다.
deploy:stage:
  stage: deploy
  image: alpine:3.24
  cache: []
  # 평소 30초 안에 끝나고 헬스체크 대기(--wait-timeout 120)보다 넉넉하다. 멈추면 resource_group 때문에 다음 배포까지 막히므로 일찍 실패시킨다.
  timeout: 10m
  dependencies: []
  # 배포 도중 취소되면 서버가 중간 상태로 남고, 두 배포가 겹치면 늦게 시작한 쪽이 먼저 끝나 옛 이미지로 덮일 수 있다.
  interruptible: false
  resource_group: stage
  variables:
    DEPLOY_USER: ubuntu
    # 접속 계정 홈 디렉터리 기준. 서버는 biglink stage 를 복제해 만들어 같은 위치를 쓴다.
    DEPLOY_PATH: service
  before_script:
    - apk add --no-cache openssh-client
    - chmod 600 "$STAGE_SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # 접속할 때마다 받은 키를 믿지 않고, 등록해 둔 호스트 키와 다르면 접속을 거부한다.
    - echo "$STAGE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - printf 'Host stage\n  HostName %s\n  User %s\n  IdentityFile %s\n  StrictHostKeyChecking yes\n' "$STAGE_SERVER_HOST" "$DEPLOY_USER" "$STAGE_SSH_PRIVATE_KEY" > ~/.ssh/config
  script:
    - ssh stage "mkdir -p $DEPLOY_PATH"
    - scp deploy/docker-compose.stage.yml "stage:$DEPLOY_PATH/docker-compose.yml"
    # 비밀번호는 ssh 명령 인자 대신 표준 입력으로 넘겨 서버 프로세스 목록에 남지 않게 한다.
    # 레지스트리 자격은 성공·실패와 관계없이 접속을 끝낼 때 지운다(trap).
    # --wait: 헬스체크를 통과할 때까지 기다리고, 실패하면 job 도 실패한다.
    - |
      echo "$CI_REGISTRY_PASSWORD" | ssh stage "
        set -e
        trap 'docker logout $CI_REGISTRY >/dev/null' EXIT
        docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'
        cd $DEPLOY_PATH
        export IMAGE='$STAGE_IMAGE'
        docker compose pull
        docker compose up -d --remove-orphans --wait --wait-timeout 120
        docker image prune -af --filter label=kr.co.bigbird.app=client-fe
        docker compose ps
      "
  environment:
    name: stage
  rules:
    - if: $CI_COMMIT_BRANCH == "stage"

# AI 규칙/에이전트 생성물이 원본과 일치하는지 검증한다. node 설치가 필요 없다.
ai-sync:
  extends: .verify
  image: python:3.12-slim
  cache: []
  before_script: []
  script:
    - python convention/ai/render.py --check
    - python ai/scripts/render_agents.py --check
  rules:
    - changes:
        - AGENTS.md
        - CLAUDE.md
        - .claude/**/*
        - .codex/**/*
        - .agents/**/*
        - ai/**/*
        - convention/ai/**/*

# [MR 전용] AI 코드 리뷰: MR 에 요약 노트 1개를 게시/갱신한다. job 자체는 머지를 막지 않는다(allow_failure).
# 대신 필수 수정은 열린 스레드로 달려, 프로젝트 설정 "All threads must be resolved" 가 켜져 있으면 해결 처리 전까지 병합을 막는다.
# 필요한 CI 변수(masked): GITLAB_REVIEW_TOKEN(Project Access Token, api scope)과
#   ANTHROPIC_API_KEY 또는 CLAUDE_CODE_OAUTH_TOKEN 중 하나. 없으면 리뷰를 건너뛴다.
# 선택: CLAUDE_MODEL, AI_REVIEW_API_BASE(러너에서 GitLab 외부 URL 의 /api/v4 가 503 일 때 내부 GitLab 주소). 리뷰 기준은 ai/review/criteria.md, checklist.md 와 .claude/rules/*.md 이다.
# Draft MR 은 작업 중이라 자동으로 돌지 않고 수동 실행(파이프라인의 ▶ 버튼)으로 둔다. Ready 로 바꾼 뒤 다음 푸시부터 자동 실행된다.
# 작업 중 리뷰는 로컬에서 `pnpm ai:review` 로 원할 때 실행한다.
ai-review:
  stage: review
  needs: []
  # 큰 MR 은 묶음 리뷰(4개 동시, 각 10분)가 두 번 돌 수 있다(scripts/ai-review.sh 의 MAX_CHUNKS·MAX_PARALLEL).
  timeout: 30m
  cache: []
  variables:
    GIT_DEPTH: "0"
    CLAUDE_CODE_VERSION: "2.1.296"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends jq
    # npm 이 설치 후 스크립트를 기본 차단하므로 claude-code 만 허용한다(경고가 안내하는 옵션). 설치가 제대로 됐는지 바로 확인한다.
    - npm install --global --allow-scripts=@anthropic-ai/claude-code "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
    - claude --version
  script:
    # merged-results 파이프라인은 (대상 브랜치 + MR) 합성 커밋을 체크아웃하므로 MR Changes 탭과 같은 코드(소스 head)로 바꿔 리뷰한다.
    # 리뷰한 코드와 인라인 코멘트 줄번호가 Changes 탭과 일치해야 한다. 일반 MR 파이프라인은 이 변수가 없어 그대로다.
    - if [ -n "${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-}" ]; then git checkout -q --detach "$CI_MERGE_REQUEST_SOURCE_BRANCH_SHA"; fi
    - bash scripts/ai-review.sh
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
      when: never
    - if: $CI_MERGE_REQUEST_DRAFT == "true" || $CI_MERGE_REQUEST_TITLE =~ /^(\[draft\]|\(draft\)|draft:)/i
      when: manual
    - when: on_success
  allow_failure: true
