# 빌드된 SPA 정적 파일만 서빙한다. API 는 브라우저가 백엔드로 직접 요청한다(백엔드가 이 앱 origin 을 CORS 허용).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite 가 파일 이름에 해시를 붙이므로 오래 캐시한다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 배포 직후 새 번들을 받도록 진입 HTML 은 매번 확인한다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: 파일이 없는 경로는 index.html 로 넘겨 클라이언트 라우터가 처리한다.
    location / {
        try_files $uri /index.html;
    }
}
