<!doctype html>
<!--
  완성된 작성 사례(2026-11-20 sonner 토스트 iOS 조사). 앱의 Toaster 를 띄우고 base·A1·A2 를 비교한다.
  이 파일은 sonner 전용 로직(A1 합성 mouseout)이 섞여 있어 출발점이 아니다.
  새 조사는 pages/_template.html 을 복사해 시작하고, 이 파일은 "[바꿀 곳]을 어떻게 채웠는지" 참고용으로만 본다.
  실행: python3 proxy.py --page examples/app-toast.html
-->
<html lang="ko"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>앱 Toaster 테스트</title>
<style>
#panel{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ccc;padding:12px;z-index:1;font:14px -apple-system,sans-serif}
#state{font-weight:700;margin:6px 0}
#log{white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace;background:#f1f5f9;padding:8px;height:26vh;overflow:auto}
button,a.v{font-size:15px;padding:8px 10px;margin:0 4px 6px 0;display:inline-block;border:1px solid #ccc;border-radius:6px;color:#000;text-decoration:none;background:#f8fafc}
a.v.on{background:#1e293b;color:#fff}
</style></head><body>
<div id="root"></div>
<div id="panel">
  <div><a class="v" href="/?v=base">기존</a><a class="v" href="/?v=a1">A1 합성 mouseout</a><a class="v" href="/?v=a2">A2 sonner 패치</a></div>
  <div id="variant"></div>
  <button id="fire">토스트 띄우기</button><button id="clear">로그 지우기</button>
  <div id="state">대기 중</div><div id="log"></div>
</div>
<script>
window.__vite_plugin_react_preamble_installed__=true;
window.$RefreshReg$=()=>{};window.$RefreshSig$=()=>t=>t;
window.__VARIANT__=new URLSearchParams(location.search).get('v')||'base';
document.querySelectorAll('a.v').forEach(a=>{if(a.getAttribute('href').endsWith('='+window.__VARIANT__))a.classList.add('on')});
</script>
<script type="module">
// deps URL 의 ?v=<해시> 는 Vite 가 의존성을 다시 최적화하면 바뀐다(하드코딩하면 504). 앱 소스의 변환 결과에서 찾는다.
const pick=(txt,name)=>{
  const m=txt.match(new RegExp('"(/node_modules/\\.vite/deps/'+name+'\\.js\\?v=\\w+)"'));
  if(!m)throw new Error('deps URL 못 찾음: '+name);
  return m[1];
};
const mainTxt=await (await fetch('/src/app/main.tsx')).text();
const sonnerTxt=await (await fetch('/src/shared/ui/sonner.tsx')).text();
const {default:RD}=await import(pick(mainTxt,'react-dom_client'));
const {default:JR}=await import(pick(mainTxt,'react_jsx-dev-runtime'));
const {toast}=await import(pick(sonnerTxt,'sonner'));
const {Toaster}=await import('/src/shared/ui/sonner.tsx');
await import('/src/app/styles/index.css');
RD.createRoot(document.getElementById('root')).render(JR.jsxDEV(Toaster,{},void 0,false,{},this));

const V=window.__VARIANT__;
document.getElementById('variant').textContent=`변형: ${V} / sonner 패치 적용: ${window.__sonnerPatched?'예':'아니오'}`;
const log=document.getElementById('log'),st=document.getElementById('state');
let t0=Date.now();const ts=()=>((Date.now()-t0)/1000).toFixed(2)+'s';
const L=m=>{log.textContent=ts()+' '+m+'\n'+log.textContent};

// A1: 터치 뒤 expanded가 켜지면 sonner 컨테이너(ol)에 mouseout을 보내 React onMouseLeave를 부르게 함
let lastPointerType='';
document.addEventListener('pointerdown',e=>{lastPointerType=e.pointerType},true);
const onExpanded=li=>{
  if(V!=='a1'||li.dataset.expanded!=='true'||lastPointerType!=='touch')return;
  const ol=li.closest('[data-sonner-toaster]');
  if(ol){ol.dispatchEvent(new MouseEvent('mouseout',{bubbles:true,relatedTarget:null}));L('A1 보정: mouseout 발송')}
};
const watch=li=>{
  L('토스트 생성 expanded='+li.dataset.expanded);
  new MutationObserver(()=>{L('data-expanded='+li.dataset.expanded+' removed='+li.dataset.removed);onExpanded(li)}).observe(li,{attributes:true,attributeFilter:['data-expanded','data-removed']});
};
new MutationObserver(ms=>ms.forEach(m=>{
  m.addedNodes.forEach(n=>{if(n.nodeType===1){const li=n.matches?.('[data-sonner-toast]')?n:n.querySelector?.('[data-sonner-toast]');if(li)watch(li)}});
  m.removedNodes.forEach(n=>{if(n.nodeType===1&&(n.matches?.('[data-sonner-toast]')||n.querySelector?.('[data-sonner-toast]')))L('토스트 DOM에서 제거됨')});
})).observe(document.body,{childList:true,subtree:true});
setInterval(()=>{const li=document.querySelector('[data-sonner-toast]');st.textContent=li?`토스트 있음 expanded=${li.dataset.expanded}`:'토스트 없음'},200);
document.getElementById('fire').onclick=()=>{t0=Date.now();log.textContent='';toast('테스트 토스트',{duration:8000})};
document.getElementById('clear').onclick=()=>log.textContent='';
</script></body></html>
