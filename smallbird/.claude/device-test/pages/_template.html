<!doctype html>
<!--
  새 실기기 테스트 페이지 골격. 복사해서 쓴다:
    cp pages/_template.html pages/<주제>.html
    python3 proxy.py --port 8099 --page pages/<주제>.html
  [바꿀 곳] 표시를 찾아 고친다. 작성 규칙은 README.md "페이지 작성 규칙" 참고.
-->
<html lang="ko"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>실기기 테스트</title><!-- [바꿀 곳] 제목 -->
<style>
#panel{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ccc;padding:12px;z-index:1;font:14px -apple-system,sans-serif}
#state{font-weight:700;margin:6px 0}
#log{white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace;background:#f1f5f9;padding:8px;height:26vh;overflow:auto}
button,a.v{font-size:15px;padding:8px 10px;margin:0 4px 6px 0;display:inline-block;border:1px solid #ccc;border-radius:6px;color:#000;text-decoration:none;background:#f8fafc}
a.v.on{background:#1e293b;color:#fff}
</style></head><body>
<div id="root"></div>
<div id="panel">
  <!-- [바꿀 곳] 변형 링크. v 값은 proxy.py PATCHES 의 variant 또는 페이지 안 분기 이름과 맞춘다 -->
  <div><a class="v" href="/?v=base">기존</a><a class="v" href="/?v=a1">A1</a><a class="v" href="/?v=a2">A2</a></div>
  <div id="variant"></div>
  <button id="run">실행</button><button id="clear">로그 지우기</button>
  <div id="state">대기 중</div><div id="log"></div>
</div>
<script>
// React Fast Refresh 프리앰블 스텁: @vitejs/plugin-react 가 변환한 .tsx 는 이 값이 없으면 오류를 낸다
window.__vite_plugin_react_preamble_installed__=true;
window.$RefreshReg$=()=>{};window.$RefreshSig$=()=>t=>t;
window.__VARIANT__=new URLSearchParams(location.search).get('v')||'base';
document.querySelectorAll('a.v').forEach(a=>{if(a.getAttribute('href').endsWith('='+window.__VARIANT__))a.classList.add('on')});
// eruda(모바일용 개발자도구 패널): ?eruda=1 로 열 때만 CDN 에서 불러온다. 폰에 설치하는 것은 없다.
// 패널이 DOM 에 들어가므로 이벤트·hit-test 를 정밀하게 재는 조사에서는 켜지 말고 아래 화면 로그만 쓴다.
// 변형 링크는 ?v= 만 가지므로 eruda 를 유지하려면 주소에 &eruda=1 을 직접 붙인다.
if(new URLSearchParams(location.search).get('eruda')==='1'){
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/eruda';
  s.onload=()=>window.eruda.init();
  document.head.appendChild(s);
}
</script>
<script type="module">
// deps URL 의 ?v=<해시> 는 Vite 가 의존성을 다시 최적화하면 바뀐다(하드코딩하면 504).
// 그 deps 를 import 하는 앱 소스의 변환 결과에서 매번 찾아 쓴다.
const pick=(txt,name)=>{
  const m=txt.match(new RegExp('"(/node_modules/\\.vite/deps/'+name+'\\.js\\?v=\\w+)"'));
  if(!m)throw new Error('deps URL 못 찾음: '+name);
  return m[1];
};
const log=document.getElementById('log'),st=document.getElementById('state');
let t0=Date.now();const ts=()=>((Date.now()-t0)/1000).toFixed(2)+'s';
const L=m=>{log.textContent=ts()+' '+m+'\n'+log.textContent};
window.addEventListener('error',e=>L('오류: '+e.message));
window.addEventListener('unhandledrejection',e=>L('오류: '+(e.reason?.message||e.reason)));

const mainTxt=await (await fetch('/src/app/main.tsx')).text();
// react-dom·jsx-dev-runtime 은 CJS 라 Vite 가 default export 로 감싼다 → default 로 받는다
const {default:RD}=await import(pick(mainTxt,'react-dom_client'));
const {default:JR}=await import(pick(mainTxt,'react_jsx-dev-runtime'));
await import('/src/app/styles/index.css');

// [바꿀 곳] 측정할 실제 앱 컴포넌트. ESM 라이브러리가 필요하면 그 라이브러리를 import 하는 소스에서 pick 한다
//   예) const libTxt=await (await fetch('/src/shared/ui/sonner.tsx')).text(); const {toast}=await import(pick(libTxt,'sonner'));
const {Toaster:Target}=await import('/src/shared/ui/sonner.tsx');
RD.createRoot(document.getElementById('root')).render(JR.jsxDEV(Target,{/* [바꿀 곳] props */},void 0,false,{},this));

const V=window.__VARIANT__;
// [바꿀 곳] 응답 패치를 쓰는 변형이면 proxy.py PATCHES 의 marker 가 켜는 전역값을 여기 표시한다
document.getElementById('variant').textContent=`변형: ${V} / 패치 적용: ${window.__sonnerPatched?'예':'아니오'}`;

// 측정 대상에 이벤트 리스너를 달지 않는다(iOS 가 '클릭 가능' 요소로 보고 mouse 호환 이벤트를 보내 결과가 달라진다).
// 속성 변화만 MutationObserver 로 본다. [바꿀 곳] 선택자와 관찰할 속성
const SEL='[data-sonner-toast]', ATTRS=['data-expanded','data-removed'];
const watch=el=>{
  L('대상 생성 '+ATTRS.map(a=>a+'='+el.getAttribute(a)).join(' '));
  new MutationObserver(()=>L(ATTRS.map(a=>a+'='+el.getAttribute(a)).join(' '))).observe(el,{attributes:true,attributeFilter:ATTRS});
};
new MutationObserver(ms=>ms.forEach(m=>{
  m.addedNodes.forEach(n=>{if(n.nodeType===1){const el=n.matches?.(SEL)?n:n.querySelector?.(SEL);if(el)watch(el)}});
  m.removedNodes.forEach(n=>{if(n.nodeType===1&&(n.matches?.(SEL)||n.querySelector?.(SEL)))L('대상 DOM에서 제거됨')});
})).observe(document.body,{childList:true,subtree:true});
setInterval(()=>{const el=document.querySelector(SEL);st.textContent=el?'대상 있음':'대상 없음'},200);

// [바꿀 곳] 재현 동작. 사람이 탭할 시간을 넉넉히 둔다(예: 토스트 duration 15000)
document.getElementById('run').onclick=()=>{t0=Date.now();log.textContent='';L('실행')};
document.getElementById('clear').onclick=()=>log.textContent='';
</script></body></html>
