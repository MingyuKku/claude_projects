# 병합 게이트: 사람이든 AI 든 같은 검사를 통과해야 병합된다.
# GitLab 프로젝트 설정 > Merge requests 에서 "Pipelines must succeed" 를 켜고,
# 기본 브랜치를 protected 로 두어 직접 push 를 막는다. (CI 파일만으로는 강제되지 않는다)

stages: [verify]

default:
  image: node:24
  interruptible: true
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.verify:
  stage: verify

typecheck:
  extends: .verify
  script: [pnpm typecheck]

lint:
  extends: .verify
  script: [pnpm lint]

format:
  extends: .verify
  script: ["pnpm format:check"]

test:
  extends: .verify
  script: [pnpm test]

build:
  extends: .verify
  script: [pnpm build]

# AI 규칙/에이전트 생성물이 원본과 일치하는지 검증한다. node 설치가 필요 없다.
ai-sync:
  extends: .verify
  image: python:3.12-slim
  cache: []
  before_script: []
  script:
    - python convention/ai/render.py --check
    - python ai/scripts/render_agents.py --check
  rules:
    - changes:
        - AGENTS.md
        - CLAUDE.md
        - .claude/**/*
        - .codex/**/*
        - .agents/**/*
        - ai/**/*
        - convention/ai/**/*
