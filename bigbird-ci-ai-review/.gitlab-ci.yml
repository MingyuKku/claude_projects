# 병합 게이트: 사람이든 AI 든 같은 검사를 통과해야 병합된다.
# GitLab 프로젝트 설정 > Merge requests 에서 "Pipelines must succeed" 를 켜고,
# 기본 브랜치를 protected 로 두어 직접 push 를 막는다. (CI 파일만으로는 강제되지 않는다)

stages: [verify, review]

default:
  image: node:24
  interruptible: true
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.verify:
  stage: verify

typecheck:
  extends: .verify
  script: [pnpm typecheck]

lint:
  extends: .verify
  script: [pnpm lint]

format:
  extends: .verify
  script: ["pnpm format:check"]

test:
  extends: .verify
  script: [pnpm test]

build:
  extends: .verify
  script: [pnpm build]

# AI 규칙/에이전트 생성물이 원본과 일치하는지 검증한다. node 설치가 필요 없다.
ai-sync:
  extends: .verify
  image: python:3.12-slim
  cache: []
  before_script: []
  script:
    - python convention/ai/render.py --check
    - python ai/scripts/render_agents.py --check
  rules:
    - changes:
        - AGENTS.md
        - CLAUDE.md
        - .claude/**/*
        - .codex/**/*
        - .agents/**/*
        - ai/**/*
        - convention/ai/**/*

# [MR 전용] AI 코드 리뷰: MR 에 요약 노트 1개를 게시/갱신한다. 머지를 막지 않는다(allow_failure).
# 필요한 CI 변수(masked): GITLAB_REVIEW_TOKEN(Project Access Token, api scope)과
#   ANTHROPIC_API_KEY 또는 CLAUDE_CODE_OAUTH_TOKEN 중 하나. 없으면 리뷰를 건너뛴다.
# 선택: CLAUDE_MODEL, AI_REVIEW_API_BASE(러너에서 GitLab 외부 URL 의 /api/v4 가 503 일 때 내부 GitLab 주소). 리뷰 기준은 ai/review/criteria.md, checklist.md 와 .claude/rules/*.md 이다.
# Draft MR 은 작업 중이라 자동으로 돌지 않고 수동 실행(파이프라인의 ▶ 버튼)으로 둔다. Ready 로 바꾼 뒤 다음 푸시부터 자동 실행된다.
# 작업 중 리뷰는 로컬에서 `pnpm ai:review` 로 원할 때 실행한다.
ai-review:
  stage: review
  needs: []
  # 큰 MR 은 묶음 리뷰(4개 동시, 각 10분)가 두 번 돌 수 있다(scripts/ai-review.sh 의 MAX_CHUNKS·MAX_PARALLEL).
  timeout: 30m
  cache: []
  variables:
    GIT_DEPTH: "0"
    CLAUDE_CODE_VERSION: "2.1.296"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends jq
    # npm 이 설치 후 스크립트를 기본 차단하므로 claude-code 만 허용한다(경고가 안내하는 옵션). 설치가 제대로 됐는지 바로 확인한다.
    - npm install --global --allow-scripts=@anthropic-ai/claude-code "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
    - claude --version
  script:
    # merged-results 파이프라인은 (대상 브랜치 + MR) 합성 커밋을 체크아웃하므로 MR Changes 탭과 같은 코드(소스 head)로 바꿔 리뷰한다.
    # 리뷰한 코드와 인라인 코멘트 줄번호가 Changes 탭과 일치해야 한다. 일반 MR 파이프라인은 이 변수가 없어 그대로다.
    - if [ -n "${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-}" ]; then git checkout -q --detach "$CI_MERGE_REQUEST_SOURCE_BRANCH_SHA"; fi
    - bash scripts/ai-review.sh
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
      when: never
    - if: $CI_MERGE_REQUEST_DRAFT == "true" || $CI_MERGE_REQUEST_TITLE =~ /^(\[draft\]|\(draft\)|draft:)/i
      when: manual
    - when: on_success
  allow_failure: true
